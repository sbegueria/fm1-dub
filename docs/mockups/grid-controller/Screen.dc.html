<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DUB-1 Controller page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; overflow: hidden; background: #10141A; font-family: 'Barlow Semi Condensed', sans-serif; color: #DEE4E8">
<div style="position: relative; width: 240px; height: 240px; transform: scale(2); transform-origin: 0 0">

<!-- header -->
<sc-if value="{{noMsg}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 4px; top: 4px; height: 20px; padding: 0 6px; border-radius: 6px; background: #DEE4E8; color: #10141A; font-weight: 700; font-size: 15px; line-height: 20px">Basic</div>
<div style="position: absolute; left: 54px; top: 6px; font-weight: 600; font-size: 12px; line-height: 15px; color: #92A0B0">FULL</div>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
<div style="{{b.style}}"></div>
</sc-for>
<div style="position: absolute; left: 186px; top: 6px; font-weight: 600; font-size: 12px; line-height: 15px; color: #92A0B0">HOST</div>
<div style="position: absolute; left: 215px; top: 9px; width: 15px; height: 9px; box-sizing: border-box; border: 1px solid #92A0B0; border-radius: 2px; display: flex; gap: 1px; padding: 1px">
<div style="width: 3px; background: #92A0B0"></div><div style="width: 3px; background: #92A0B0"></div><div style="width: 3px; background: #92A0B0"></div>
</div>
<div style="position: absolute; left: 230px; top: 12px; width: 2px; height: 3px; background: #92A0B0"></div>
</sc-if>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 10px; top: 6px; display: flex; gap: 8px; font-weight: 700; font-size: 15px; line-height: 16px">
<span style="color: #DEE4E8">{{msgA}}</span><span style="color: #5CC4CC">{{msgB}}</span>
</div>
</sc-if>

<!-- the EF44, as it sits: encoders over faders -->
<sc-for list="{{cells}}" as="c" hint-placeholder-count="8">
<div style="{{c.box}}">
<div style="{{c.idStyle}}">{{c.id}}</div>
<sc-if value="{{c.isEnc}}" hint-placeholder-val="{{ true }}">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="position: absolute; right: 4px; top: 3px">
<path d="{{c.iconTrack}}" fill="none" stroke="#404C5E" stroke-width="2.5" stroke-linecap="round"></path>
<path d="{{c.iconFill}}" fill="none" stroke="{{c.iconColor}}" stroke-width="2.5" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{c.isFader}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 7px; top: 3px; width: 4px; height: 12px; border-radius: 2px; background: #404C5E; overflow: hidden">
<div style="{{c.barFill}}"></div>
</div>
</sc-if>
<div style="{{c.nameStyle}}">{{c.name}}</div>
<div style="{{c.ccStyle}}">{{c.ccText}}</div>
<sc-if value="{{c.isEnc}}" hint-placeholder-val="{{ true }}">
<div style="{{c.pushBox}}">
<span style="{{c.pushStyle}}">{{c.pushText}}</span>
<sc-if value="{{c.muted}}" hint-placeholder-val="{{ false }}">
<span style="padding: 0 3px; border-radius: 3px; background: #803834; color: #F4D6D2; font-size: 9px; line-height: 11px; font-weight: 700">MUTED</span>
</sc-if>
</div>
</sc-if>
<sc-if value="{{c.isFader}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 5px; right: 5px; bottom: 7px; height: 3px; border-radius: 2px; background: #404C5E; overflow: hidden">
<div style="{{c.meterFill}}"></div>
</div>
</sc-if>
</div>
</sc-for>

<!-- the big ring, while something turns -->
<sc-if value="{{hasBig}}" hint-placeholder-val="{{ false }}">
<div style="{{bigPanel}}"></div>
<div style="{{bigTitleStyle}}">{{bigTitle}}</div>
<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true" style="position: absolute; left: 72px; top: 44px">
<circle cx="48" cy="48" r="44" fill="#10141A"></circle>
<path d="{{bigTrack}}" fill="none" stroke="#404C5E" stroke-width="6" stroke-linecap="round"></path>
<path d="{{bigFill}}" fill="none" stroke="{{bigColor}}" stroke-width="6" stroke-linecap="round"></path>
</svg>
<div style="{{bigValueStyle}}">{{bigValue}}</div>
<div style="position: absolute; left: 4px; width: 232px; top: 136px; text-align: center; font-weight: 500; font-size: 15px; line-height: 16px; color: #B3BEC8">{{bigHelp}}</div>
</sc-if>

<!-- a card: a mute, a learn -->
<sc-if value="{{hasCard}}" hint-placeholder-val="{{ false }}">
<div style="{{cardBox}}">
<div style="{{cardHeadStyle}}">{{cardHead}}</div>
<div style="font-weight: 600; font-size: 12px; line-height: 15px; color: #92A0B0">{{cardLine}}</div>
</div>
</sc-if>

<!-- the knob strip -->
<div style="position: absolute; left: 0; top: 168px; width: 240px; height: 14px; display: flex; align-items: center; gap: 5px; padding: 0 6px; box-sizing: border-box">
<span style="font-weight: 600; font-size: 12px; line-height: 15px; color: #5CC4CC">CONTROLLER</span>
<span style="font-weight: 600; font-size: 12px; line-height: 15px; color: #92A0B0">3/3</span>
<div style="flex-grow: 1; height: 1px; background: #404C5E"></div>
<span style="font-weight: 600; font-size: 12px; line-height: 15px; color: #92A0B0">{{ruleRight}}</span>
</div>
<div style="position: absolute; left: 60px; top: 188px; width: 1px; height: 50px; background: #404C5E"></div>
<div style="position: absolute; left: 120px; top: 188px; width: 1px; height: 50px; background: #404C5E"></div>
<div style="position: absolute; left: 180px; top: 188px; width: 1px; height: 50px; background: #404C5E"></div>
<sc-for list="{{knobs}}" as="k" hint-placeholder-count="4">
<sc-if value="{{k.hot}}" hint-placeholder-val="{{ false }}">
<div style="{{k.hotBox}}"></div>
</sc-if>
<div style="{{k.labelStyle}}">{{k.label}}</div>
<sc-if value="{{k.isRing}}" hint-placeholder-val="{{ true }}">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="{{k.ringPos}}">
<path d="{{k.track}}" fill="none" stroke="#404C5E" stroke-width="5" stroke-linecap="round"></path>
<path d="{{k.fill}}" fill="none" stroke="{{k.fillColor}}" stroke-width="5" stroke-linecap="round"></path>
</svg>
<div style="{{k.numStyle}}">{{k.num}}</div>
</sc-if>
<sc-if value="{{k.isWord}}" hint-placeholder-val="{{ false }}">
<div style="{{k.wordStyle}}">{{k.word}}</div>
<sc-if value="{{k.hasDots}}" hint-placeholder-val="{{ true }}">
<div style="{{k.dotsRow}}">
<sc-for list="{{k.dots}}" as="d" hint-placeholder-count="8">
<div style="{{d.style}}"></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{k.hasBar}}" hint-placeholder-val="{{ false }}">
<div style="{{k.barLine}}"></div>
<div style="{{k.barDot}}"></div>
</sc-if>
</sc-if>
</sc-for>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"model":{"editor":null},"$preview":{"width":480,"height":480}}'>
const ACC = '#5CC4CC', DIM = '#92A0B0', TEXT = '#DEE4E8', LINE = '#404C5E', BG = '#10141A', PANEL = '#242C38', PAD = '#54C8BA';
const T = [
  ['Off', 'off', DIM], ['Filter', 'flt', ACC], ['Wet', 'mac', ACC], ['Energy', 'mac', ACC], ['Duck', 'mac', ACC],
  ['Chord', 'lvl', '#54C8BA'], ['Pings', 'lvl', '#80AAE0'], ['Bass', 'lvl', '#CCB470'], ['Drums', 'lvl', '#EC9654'],
  ['Kick', 'lvl', '#EC9654'], ['Hats', 'lvl', '#DEE4E8'], ['Noise', 'lvl', '#BAAE9C'],
  ['Cutoff', 'ctr', '#54C8BA'], ['Reso', 'ctr', '#54C8BA'], ['Attack', 'pct', '#54C8BA'], ['Decay', 'pct', '#54C8BA'],
  ['Reverb', 'pct', ACC], ['Echo', 'pct', ACC], ['Feedback', 'pct', ACC], ['Echo time', 'step', ACC], ['Cloud', 'pct', ACC],
  ['Density', 'pct', '#80AAE0'], ['Vary', 'pct', ACC], ['Hits', 'pct', '#EC9654'], ['Swing', 'pct', '#EC9654'], ['Size', 'pct', ACC]
];
const P = [['Chord', '#54C8BA', 1], ['Pings', '#80AAE0', 2], ['Bass', '#CCB470', 4], ['Kick', '#EC9654', 8],
           ['Hats', '#DEE4E8', 16], ['Noise', '#BAAE9C', 32], ['Drums', '#EC9654', 24], ['Off', DIM, 0]];
const DEF = { sel: 4, vals: [64, 64, 40, 50, 90, 45, 76, 83], tgt: [1, 2, 17, 16, 5, 6, 7, 8], cc: [32, 33, 34, 35, 36, 37, 38, 39],
              push: [0, 2, 3, 4], note: [32, 33, 34, 35], mutes: 8, ch: 1, learn: false, big: null, card: null, flash: -1, hot: -1,
              msg: null };

function arc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const p = (a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const s = p(a0), e = p(a1);
  return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (Math.abs(a1 - a0) > 180 ? 1 : 0) +
         ' ' + (a1 > a0 ? 1 : 0) + ' ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
}
function fillArc(cx, cy, r, f, centred) {
  return centred ? arc(cx, cy, r, 270, 270 + (f - 0.5) * 270) : arc(cx, cy, r, 135, 135 + 270 * f);
}
function lbl(k) { return k < 4 ? 'E' + (k + 1) : k < 8 ? 'F' + (k - 3) : 'E' + (k - 7) + ' push'; }
function abs(x, y, w, h) { return 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + w + 'px; height: ' + h + 'px;'; }

class Component extends DCLogic {
  renderVals() {
    const m = Object.assign({}, DEF, this.props.model || {});
    const cells = [];
    for (let i = 0; i < 8; i++) {
      const enc = i < 4, x = 4 + (i % 4) * 58, y = enc ? 30 : 98, h = enc ? 64 : 66;
      const t = T[m.tgt[i]], v = m.vals[i], f = v / 127, flash = m.flash === i, sel = m.sel === i;
      const ink = flash ? BG : TEXT, inkDim = flash ? BG : DIM;
      const c = {
        id: lbl(i), isEnc: enc, isFader: !enc, name: t[0], ccText: 'CC ' + m.cc[i],
        box: abs(x, y, 54, h) + ' box-sizing: border-box; border-radius: 6px; background: ' + (flash ? PAD : PANEL) +
             '; border: 2px solid ' + (sel ? ACC : 'transparent') + ';',
        idStyle: 'position: absolute; left: 4px; top: 1px; font-weight: 600; font-size: 12px; line-height: 15px; color: ' + inkDim,
        nameStyle: 'position: absolute; left: 4px; top: 16px; width: 46px; white-space: nowrap; overflow: hidden; font-weight: 700; font-size: ' +
                   (t[0].length > 7 ? 12 : 15) + 'px; line-height: 16px; color: ' + (m.tgt[i] === 0 ? inkDim : ink),
        ccStyle: 'position: absolute; left: 4px; top: 31px; font-weight: 600; font-size: 12px; line-height: 15px; color: ' + inkDim,
        iconTrack: arc(7, 7, 5, 135, 405),
        iconFill: fillArc(7, 7, 5, f, t[1] === 'flt' || t[1] === 'ctr' || t[1] === 'mac'),
        iconColor: flash ? BG : t[2],
        barFill: 'width: 4px; margin-top: ' + Math.round(12 * (1 - f)) + 'px; height: ' + Math.round(12 * f) + 'px; background: ' + (flash ? BG : t[2]),
        meterFill: 'height: 3px; width: ' + Math.round(f * 100) + '%; background: ' + (flash ? BG : t[2])
      };
      if (enc) {
        const p = P[m.push[i]], muted = p[2] !== 0 && (m.mutes & p[2]) === p[2], psel = m.sel === 8 + i;
        c.muted = muted;
        c.pushText = 'PUSH ' + p[0].toUpperCase();
        c.pushStyle = 'font-weight: 600; font-size: 12px; line-height: 15px; color: ' + (muted || p[2] === 0 ? DIM : p[1]);
        c.pushBox = 'position: absolute; left: 1px; right: 1px; bottom: 1px; height: 17px; box-sizing: border-box; padding: 0 2px; border-top: 1px solid ' +
                    LINE + '; display: flex; align-items: center; gap: 3px; border-radius: 0 0 4px 4px; outline: ' +
                    (psel ? '2px solid ' + ACC : 'none') + ';';
      }
      cells.push(c);
    }
    const bars = [];
    for (let i = 0; i < 8; i++) {
      const tall = i === 3 || i === 7;
      bars.push({ style: abs(80 + i * 9, tall ? 8 : 10, 6, tall ? 11 : 9) + ' background: ' + (i < 2 ? TEXT : i === 2 ? ACC : LINE) });
    }
    const sel = m.sel, isPush = sel >= 8, j = isPush ? sel - 8 : sel;
    const ctl = isPush ? m.note[j] : m.cc[j];
    const knobs = [];
    const kn = (i, label) => {
      const x = i * 60, hot = m.hot === i;
      return { label: label, hot: hot, hotBox: abs(x + 3, 182, 54, 56) + ' border-radius: 6px; background: ' + PANEL,
               labelStyle: abs(x, 184, 60, 16) + ' text-align: center; font-weight: 500; font-size: ' + (label.length > 7 ? 12 : 15) +
                           'px; line-height: 16px; color: ' + TEXT,
               ringPos: 'position: absolute; left: ' + (x + 10) + 'px; top: 198px' };
    };
    const word = (k, w, color) => {
      k.isWord = true;
      k.word = w;
      k.wordStyle = abs(k.x0, 199, 60, 16) + ' text-align: center; white-space: nowrap; font-weight: 700; font-size: ' + (w.length > 6 ? 12 : 15) +
                    'px; line-height: 16px; color: ' + (color || TEXT);
    };
    const dots = (k, n, at, color) => {
      const gap = n > 8 ? 4 : 6, d = [];
      for (let q = 0; q < n; q++)
        d.push({ style: q === at ? 'width: 5px; height: 5px; border-radius: 2px; background: ' + color
                                 : 'width: 2px; height: 2px; border-radius: 1px; background: ' + DIM });
      k.hasDots = true;
      k.dots = d;
      k.dotsRow = abs(k.x0, 222, 60, 5) + ' display: flex; align-items: center; justify-content: center; gap: ' + (gap - 2) + 'px';
    };
    const ring = (k, f, num, color) => {
      k.isRing = true;
      k.track = arc(20, 20, 16, 135, 405);
      k.fill = fillArc(20, 20, 16, f, false);
      k.fillColor = color;
      k.num = num;
      k.numStyle = abs(k.x0, 211, 60, 15) + ' text-align: center; font-weight: 600; font-size: 12px; line-height: 15px; color: ' + TEXT;
    };
    const k1 = kn(0, 'CONTROL'); k1.x0 = 0;
    word(k1, lbl(sel), m.hot === 0 ? ACC : TEXT);
    dots(k1, 12, sel, m.hot === 0 ? ACC : PAD);
    const k2 = kn(1, isPush ? 'MUTES' : 'TARGET'); k2.x0 = 60;
    if (isPush) {
      const p = P[m.push[j]];
      word(k2, p[0], p[1]);
      dots(k2, 8, m.push[j], p[1]);
    } else {
      const t = T[m.tgt[j]];
      word(k2, t[0], m.tgt[j] === 0 ? DIM : TEXT);
      k2.hasBar = true;
      k2.barLine = abs(70, 224, 40, 1) + ' background: ' + LINE;
      k2.barDot = abs(68 + Math.round(40 * m.tgt[j] / 25), 222, 5, 5) + ' border-radius: 2px; background: ' + (m.hot === 1 ? ACC : PAD);
    }
    const k3 = kn(2, isPush ? 'NOTE' : 'CC'); k3.x0 = 120;
    if (m.learn) {
      word(k3, 'Learn', ACC);
      k3.hasDots = false;
    } else {
      ring(k3, ctl / 127, String(ctl), m.hot === 2 ? ACC : PAD);
    }
    const k4 = kn(3, 'CHANNEL'); k4.x0 = 180;
    ring(k4, (m.ch - 1) / 15, String(m.ch), m.hot === 3 ? ACC : PAD);
    knobs.push(k1, k2, k3, k4);

    const b = m.big, c = m.card;
    const bigColor = b ? b.color || ACC : ACC;
    const mix = (h) => { const a = [16, 20, 26], q = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
                         return 'rgb(' + a.map((v, i) => Math.round(v + (q[i] - v) * 7 / 16)).join(',') + ')'; };
    return {
      noMsg: !m.msg, hasMsg: !!m.msg, msgA: m.msg ? m.msg.a : '', msgB: m.msg ? m.msg.b : '',
      bars: bars, cells: cells, knobs: knobs, ruleRight: 'EF44 · CH ' + m.ch,
      hasBig: !!b,
      bigPanel: abs(2, 28, 236, 140) + ' box-sizing: border-box; border-radius: 6px; background: rgba(16,20,26,0.86); border: 1px solid ' + mix(bigColor),
      bigTitle: b ? b.title.toUpperCase() : '',
      bigTitleStyle: abs(0, 28, 240, 21) + ' text-align: center; font-weight: 700; font-size: 20px; line-height: 21px; color: ' + bigColor,
      bigTrack: arc(48, 48, 40, 135, 405),
      bigFill: b ? fillArc(48, 48, 40, b.frac, !!b.centred) : '',
      bigColor: bigColor,
      bigValue: b ? b.value : '',
      bigValueStyle: abs(40, b && b.value.length > 6 ? 82 : 76, 160, 32) + ' text-align: center; white-space: nowrap; font-weight: 700; font-size: ' +
                     (b && b.value.length > 6 ? 20 : 31) + 'px; line-height: ' + (b && b.value.length > 6 ? 21 : 32) + 'px; color: ' + TEXT,
      bigHelp: b ? b.help || '' : '',
      hasCard: !!c,
      cardBox: abs(22, 58, 196, 50) + ' box-sizing: border-box; border-radius: 6px; background: ' + PANEL + '; border: 2px solid ' + (c ? c.color : ACC) +
               '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px',
      cardHeadStyle: 'font-weight: 700; font-size: 15px; line-height: 16px; color: ' + (c ? c.color : ACC),
      cardHead: c ? c.head : '', cardLine: c ? c.line : ''
    };
  }
}
</script>
</body>
</html>
