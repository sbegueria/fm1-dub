<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EN16 page: Tracks layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px">
<dc-import name="GridScreen" model="{{model}}" hint-size="480px,480px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      model: { page: 'en16', layout: 'tracks', sel: 2, hot: -1, mutes: 0, flash: -1,
               trk: { cols: [0, 1, 2, 6], rows: [0, 1, 2, 4], fx: [17, 18, 16, 25], push: [1, 2, 2, 1],
                      vals: [64, 70, 38, 64, 40, 30, 20, 50, 50, 60, 30, 40, 70, 76, 64, 70] } }
    };
  }
}
</script>
</body>
</html>
